<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/backoffice.css">
    <title>Marketplace Backoffice</title>
</head>

<body class="position-relative">
    <nav class="navbar navbar-expand-lg bg-body-secondary">
        <div class="container">
            <a class="navbar-brand" href="../index.html">M'sM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            <i class="bi bi-house d-lg-none"></i>
                            Home
                            </i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container mt-5">
        <h1 class="text-center">Mattia's Marketplace - Backoffice</h1>
        <p class="pageDescription">In questa sezione puoi aggiungere un prodotto al database,<br> oppure modificarne uno
            già esistente.</p>
        <form class="mt-5">
            <div class="mb-3 inputContainers">
                <label class="formLabels" for="productName">Nome del prodotto</label>
                <input class="form-control mx-auto w-75" type="text" name="productName" id="productName">
            </div>
            <div class="mb-3 inputContainers">
                <label class="formLabels" for="productDescription">Descrizione del prodotto</label>
                <input class="form-control mx-auto w-75" type="text" name="productDescription" id="productDescription">
            </div>
            <div class="mb-3 inputContainers">
                <label class="formLabels" for="productImg">URL dell'immagine</label>
                <input class="form-control mx-auto w-75" type="text" name="productImg" id="productImg">
            </div>
            <div class="d-flex justify-content-evenly">
                <div class="mb-3 inputContainers">
                    <label class="formLabels" for="productBrand">Marca del prodotto</label>
                    <input class="form-control w-75" type="text" name="productBrand" id="productBrand">
                </div>
                <div class="mb-3 inputContainers">
                    <label class="formLabels" for="productPrice">Prezzo</label>
                    <input class="form-control w-75" type="number" name="productPrice" id="productPrice">
                </div>
            </div>
        </form>
        <div class="btn-containers d-flex gap-3 justify-content-center">
            <button class="btn add-btn" onclick="addProduct()">Aggiungi</button>
            <button class="btn edit-btn" onclick="editProduct()">Modifica</button>
            <button class="btn delete-btn" onclick="deleteProduct()">Rimuovi</button>
        </div>
    </main>



    <footer class="position-absolute bottom-0 w-100">
        <div class="container d-flex gap-3 justify-content-center mt-3">
            <a class="footer-link" href="../index.html">Home</a>
            <a class="footer-link" href="#">Backoffice</a>
        </div>
        <hr class="my-3 w-75 m-auto">
        <p class="text-center"> © M'sM, Inc</p>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../js/backoffice.js"></script>
</body>

</html>
